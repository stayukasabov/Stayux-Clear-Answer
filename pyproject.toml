[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stayux-clear-answer"
version = "0.1.0"
description = "Stayux Clear Answer: make Claude reply in short, plain English. Deterministic linter plus Claude Code plugin and Desktop skill. Compatible with Simplified Technical English (ASD-STE100). Unofficial."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stayux (Stayu Kasabov)", email = "stayu.kasabov@gmail.com" }]
keywords = ["ste", "asd-ste100", "simplified-technical-english", "linter", "technical-writing"]
dependencies = []

[project.urls]
Homepage = "https://github.com/stayukasabov/Stayux-Clear-Answer"

[tool.setuptools]
py-modules = ["ste_lint", "ste_dictionary"]

[tool.setuptools.package-dir]
"" = "scripts"
